<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>策略挑戰</title>
<style>
:root{color-scheme:dark;--ink:#f5ebda;--muted:#c0b5aa;--gold:#e9bf7e;--panel:#201b23;--stroke:#584838;--jade:#72dbbd;--rose:#ffa799}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 85% 0%,#3b282c,transparent 52%),#151318;color:var(--ink);font:16px/1.5 "PingFang HK","Noto Sans CJK TC",system-ui,sans-serif}
main{max-width:810px;margin:auto;padding:20px 14px 50px}
a{color:var(--gold)} h1,h2,h3,p{margin:0} h1{font-size:clamp(29px,6vw,47px);letter-spacing:.05em;margin:14px 0 6px}
nav,.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
nav{margin:16px 0} button,select,input{font:inherit}
button,select,input{border:1px solid #80705c;border-radius:7px;background:#302934;color:var(--ink);min-height:44px;padding:8px 12px}
button{cursor:pointer} button:hover:not(:disabled){border-color:var(--gold)} button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
button:disabled{opacity:.5;cursor:default} .primary,[aria-pressed=true]{background:#594228;border-color:#cb9b61}
.panel{background:var(--panel);border:1px solid var(--stroke);border-radius:14px;padding:clamp(12px,3vw,24px)}
.sub,.caption,small{color:var(--muted)} .caption{font-size:14px} .stats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.stats span,.tag{display:inline-block;border-radius:6px;background:#302733;padding:4px 9px;border:1px solid var(--stroke)}
.status{min-height:24px;margin:10px 0;color:var(--gold)} .actions{margin-top:14px}
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:min(100%,430px);margin:12px auto;border:1px solid #9d7553;background:#4e352d;padding:4px;border-radius:8px}
.cell{display:grid;place-items:center;padding:0;width:100%;min-height:0;aspect-ratio:1;background:#d0a976;box-shadow:inset 0 0 0 1px #f4d3a1;border:0;border-radius:3px;color:#311f19}
.cell:disabled{opacity:1} .cell.selected{background:#f4d59d;outline:3px solid #47311f;outline-offset:-4px}
.stone{display:block;width:69%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 1px 0 #fff7,0 2px 3px #291913aa;background:radial-gradient(circle at 33% 22%,#d6fff2,#427b70 55%,#1f4d45)}
.stone.ember{background:radial-gradient(circle at 33% 22%,#ffd8c1,#ba503a 55%,#711e13)} .stone.neutral{background:radial-gradient(circle at 33% 22%,#eee0cd,#737078 55%,#403641)}
.bid-grid,.towers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}
.bid-grid label{display:grid;gap:4px} input[type=number]{width:100%;min-width:0} .tower{min-width:0;min-height:225px;display:flex;flex-direction:column;justify-content:end;gap:5px;padding:6px;background:#201a22}
.tile{display:block;color:#251910;background:linear-gradient(160deg,#f2d29f,#b48559);border:1px solid #ecc89a;border-radius:5px;padding:3px;text-align:center;font-weight:750}
.tile.minus{background:linear-gradient(160deg,#fac0b0,#be7662)} .tile.times{background:linear-gradient(160deg,#ace5d4,#66a393)}
.goal{color:var(--jade)} .history{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.history li{display:grid;grid-template-columns:minmax(65px,1fr) 3fr 54px;align-items:center;gap:8px;padding:7px;border-bottom:1px solid var(--stroke)} meter{width:100%;height:16px;accent-color:var(--jade)}
.guess input{flex:1;min-width:120px} .guess{margin-top:10px} details{margin:14px 0}
summary{cursor:pointer} .wordlist{margin:8px 0;max-height:150px;overflow:auto;line-height:1.8}
.board{grid-template-columns:repeat(15,minmax(0,1fr));gap:0;padding:8px;background:#cba36f}.cell{box-shadow:none;border-radius:0;background:linear-gradient(90deg,transparent 48%,#785a36 48% 52%,transparent 52%),linear-gradient(transparent 48%,#785a36 48% 52%,transparent 52%)}.stone{width:85%;background:radial-gradient(at 35% 25%,#62616b,#0c0b0c 70%)}.stone.ember{background:radial-gradient(at 35% 25%,white,#ded5ca 68%,#a99b91)}.tile.num{background:#c3a7eb}.hero{float:right;width:clamp(75px,21vw,148px);height:108px;object-fit:cover;border-radius:8px;margin:0 0 8px 12px}.panel{clear:both}.grad-rack{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin:16px 0}.grad-cup{padding:6px 1px;text-align:center;border-radius:4px 4px 10px 10px;border:1px solid #a39a89;display:grid;align-content:center;gap:4px;min-height:65px;box-shadow:inset 3px 0 6px #0002}.grad-cup strong{font-size:23px}.grad-cup select{width:100%;min-width:0;padding:0;min-height:40px}.grad-cup.g0{background:#171719;color:#fff}.grad-cup.g1{background:#55565a;color:white}.grad-cup.g2{background:#aeadae;color:#161619}.grad-cup.g3{background:#f1eee6;color:#161619}.grad-shown{display:flex;gap:12px;align-items:center;margin:12px 0}.grad-shown .grad-cup{min-width:70px}.grad-rack button:disabled{opacity:.27}.final-grid{display:grid;grid-template-columns:repeat(var(--size),minmax(0,1fr));gap:3px;max-width:465px;margin:16px auto}.final-grid button{padding:0;min-height:0;aspect-ratio:1;border-color:#77644d;background:#2c2732;font-weight:bold}.final-grid .side0{color:#a2f9e4;background:#214b45}.final-grid .side1{color:#ffc5b3;background:#623d43}.final-grid .legal{outline:2px solid #f8cc75;outline-offset:-3px}.final-grid button:disabled{opacity:.77}.equation-row{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;max-width:465px;margin:7px 0;text-align:center}.equation-row span{padding:6px 0;border-radius:4px;font-weight:bold;color:#18191b}.eq-0{background:#ff8b89}.eq-1{background:#ffda70}.eq-2{background:#8befaa}</style>
</head>
<body><main>
<a href="./">‹ 所有遊戲</a>
<nav aria-label="挑戰選擇" id="tabs"></nav>
<img id="hero" class="hero" alt=""><h1 id="title"></h1>
<p id="episode" class="caption"></p>
<p id="intro" class="sub"></p>
<details><summary>遊戲玩法</summary><p id="rules"></p></details>
<section id="game" class="panel"></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const panel=$('game');
const sections={
  janggi:["紙牌韓國象棋", "排好移動牌，搶攻對方王棋。", "同機雙人。秘密排好五張自製移動牌，交機後公開雙方下一張牌。輪流按牌移動一粒棋，食王或用自己嘅王攻入對方王嘅起始格即勝。五張用完即重排。每局交替先手，先贏兩局勝出。"],
  colors:["顏色連線", "用落子困住對手，或者質疑對方無法連線。", "同機雙人。8×8 棋盤有六對棋，首手落一粒，其後每手落兩粒不同色棋。只剩最後一粒時可單放。對方落子後可質疑，上一手玩家要逐色畫出橫直路線，每條至少五格，路線不得重疊。只得一個端點時，可以路線末端補上另一粒。證明成功得分，放棄則由質疑者得分。棋粒落齊亦會驗證，先到三分勝出。"],
  lights:["算式交通燈", "秘密設題，靠紅黃綠燈拆解對方算式。", "同機雙人。每方輸入九格有效算式。雙方暗中提交九格猜測，再同時揭曉。綠色係位置正確，黃色係字元存在但位置有誤，紅色係無剩餘配對。先估中者勝出，同輪命中重賽。八輪都未估中，比較各自單次最高綠格數。"],

  grad:['漸層','睇對手嘅杯色，估佢今輪出大定出細。','三人抽籤，1、2 號先對戰，3 號輪候。每場重新秘密配七杯，兩端黑色，向中央逐級變淺。0 至 9 各有兩粒，每杯放一粒，由左至右數字不可遞減，總和最多 30。首場由 1 號先手，其後每回合由上一回合勝方先出杯，平手維持先手。後手只會見到杯色，揀好先一齊揭數。大數得 1 分，平手無分，出過嘅杯不能再用。每場七回合，高分者勝，領先至無法追平可提早完場。全場平分則原班兩人重賽。勝方留場對輪候者並先手，首先累積兩場勝利即晉級。'],
  line:['點數五子棋','輪流揀三點，秘密競投棋位。','黑棋先選。每輪揀橫、直或斜線上連續三個空位。每人收 10 點，每格暗投至少 1 整點，高價落子，同價歸非選位方。餘點減半向下取整後帶入下輪。同步落完三子先判定，恰好五連先計，六連以上無效。同輪比較五連條數。'],
  tower:['算式之塔','鬥少步報價，再親手砌出目標算式。','三人搶報步數，每人只可報一次。其餘人可報更少步，最低者獨自示範。每步可搬頂部一組積木，可反轉整組，亦可原地翻轉。指定高度、指定結果、所報步數要全部吻合。由頂向下讀，頂層必須係無符號數字，先乘後加減。首報成功加 1、失敗扣 1；後報加扣 2。塔形帶入下一題。先到 7 分完場，包尾同分加賽。'],
  words:['隱藏詞語','保護自己嘅秘密詞，同時估中對手嘅詞。','抽籤定次序，每人獲五個普通名詞。第一輪五揀一，第二輪從餘下四個再揀。每階段出題人最多提供十個名詞線索，公開相似度，達 95% 即停，否則系統補最高相似度提示。其他人暗中作答，齊人先揭曉。每個秘密詞可花一枚 Piece 加答一次。估中者各得 1 分並結束該題。全員估錯，出題人按階段得 1、2、3 分。每題最多三階段，第二輪全部分數加倍。繁中版用本地詞庫評分。']
};
const order={words:[49,11],tower:[50,12],line:[51,13],grad:[57,13],janggi:[58,14],colors:[59,14],lights:[60,14]};
let active='words';
function el(parent,tag,text='',className=''){
  const node=document.createElement(tag);
  node.className=className;node.textContent=text;parent.append(node);return node;
}
function button(parent,label,click,className=''){
  const node=el(parent,'button',label,className);node.type='button';node.onclick=click;return node;
}
function status(text=''){const node=el(panel,'p',text,'status');node.setAttribute('role','status');return node}
function tabs(){ $('tabs').replaceChildren();for(const [key,[id]] of Object.entries(order)){
  const node=button($('tabs'),id+' '+sections[key][0],()=>selectGame(key));
  node.setAttribute('aria-pressed',String(key===active));
}}
function selectGame(key){
  active=Object.hasOwn(sections,key)?key:'words';
  const [title,intro,rules]=sections[active];
  const [id,episode]=order[active];
  $('title').textContent=id+' '+title;$('episode').textContent='第 3 季・第 '+episode+' 集';$('intro').textContent=intro;$('rules').textContent=rules;
  $('hero').src=(typeof coverData==='undefined'?'./art/game-'+id+'.webp':coverData[id]);
  document.title=title+'｜策略挑戰';tabs();
  ({janggi:cardJanggi,colors:colorLink,lights:equationLights,grad:gradLobby,line:lineLobby,tower:towerLobby,words:wordLobby})[active]();
}
function choice(parent,label,entries){
  const wrap=el(parent,'label',label+' ');
  const select=el(wrap,'select');
  for(const [id,text] of entries){const option=el(select,'option',text);option.value=id}
  return select;
}
function shuffle(data){const copy=data.slice();for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
const N=15, directions=[[1,0],[0,1],[1,1],[-1,1]];
const point=i=>String.fromCharCode(65+i%N)+(Math.floor(i/N)+1);
function ray(i,dx,dy,k){
 const x=i%N+dx*k,y=Math.floor(i/N)+dy*k;
 return x<0||x>=N||y<0||y>=N?-1:y*N+x;
}
function lineWins(board,team){
 let count=0;
 board.forEach((v,i)=>{if(v===team)for(const [x,y] of directions){
 if(board[ray(i,x,y,-1)]===team)continue;
 let n=1;while(board[ray(i,x,y,n)]===team)n++;if(n===5)count++;
 }});return count;
}
function emptyPairs(board){
 const out=[];
 board.forEach((v,i)=>{if(!v)for(const [x,y] of directions){
 const cells=[i,ray(i,x,y,1),ray(i,x,y,2)];if(cells.every(k=>board[k]===0))out.push(cells);
 }});return out;
}
const duelNames=['黑棋','白棋'];
function lineLobby(){
  panel.replaceChildren();el(panel,'h2','選擇對手');
  const actions=el(panel,'div','','row actions');
  button(actions,'對電腦',()=>playLine(true),'primary');
  button(actions,'同機雙人',()=>playLine(false));
}
function playLine(cpu){
  const board=Array(N*N).fill(0),stock=[10,10];
  let round=1,owner=0,pair=[],offers=[],phase='pick',turn=0,note='',result='';
  function botPair(){
    const pairs=shuffle(emptyPairs(board));
    return pairs.find(cells=>cells.some(i=>threat(i,2)))||pairs.find(cells=>cells.some(i=>threat(i,1)))||pairs[0];
  }
  function threat(i,team){const next=board.slice();next[i]=team;return lineWins(next,team)}
  function beginBids(){
    turn=owner;offers=[];phase='bid';
    if(cpu&&turn===1)lockBid(1,botBid());
    else paint();
  }
  function botBid(){
    const priority=pair.map(i=>Number(threat(i,2))*2+Number(threat(i,1)));
    const bid=[1,1,1], limit=stock[1]-Math.floor(Math.random()*3);
    const best=priority.indexOf(Math.max(...priority));
    for(let n=3;n<limit;n++)bid[priority[best]&&Math.random()<0.7?best:Math.floor(Math.random()*3)]++;
    return bid;
  }
  function lockBid(team,bid){
    if(phase!=='bid'||team!==turn||bid.some(n=>!Number.isInteger(n)||n<1)||bid.reduce((a,b)=>a+b,0)>stock[team])return;
    offers[team]=bid;
    if(offers[0]&&offers[1]){
      pair.forEach((cell,i)=>{board[cell]=offers[0][i]===offers[1][i]?2-owner:offers[0][i]>offers[1][i]?1:2});
      for(let i=0;i<2;i++)stock[i]=Math.floor((stock[i]-offers[i].reduce((a,b)=>a+b,0))/2);
      note=pair.map((cell,i)=>point(cell)+'（'+(duelNames[board[cell]-1]||'中立')+'）').join('　');
      const wins=[lineWins(board,1),lineWins(board,2)];
      if(wins[0]||wins[1])result=wins[0]===wins[1]?'雙方五連條數相同，和局。':duelNames[wins[0]>wins[1]?0:1]+'勝出！';
      else if(!emptyPairs(board).length)result='無相連空格，和局。';
      phase=result?'done':'review';paint();return;
    }
    turn=1-team;
    if(cpu&&turn===1){lockBid(1,botBid());return}
    phase=cpu?'bid':'pass';paint();
  }
  function next(){
    round++;owner=1-owner;pair=[];offers=[];note='';
    for(let i=0;i<2;i++)stock[i]=stock[i]+10;
    phase='pick';
    if(cpu&&owner===1){pair=botPair();beginBids();return}
    paint();
  }
  function paint(){
    panel.replaceChildren();const info=el(panel,'div','','stats');
    for(const label of ['第 '+round+' 輪',phase==='bid'?duelNames[turn]+' 可用 '+stock[turn]+' 點':'選位方：'+duelNames[owner]])el(info,'span',label);
    status(result||note||(phase==='pick'?duelNames[owner]+'揀同一直線上連續三個空位。':'本輪提名 '+pair.map(point).join('、')));
    const grid=el(panel,'div','','board');grid.setAttribute('aria-label','十五路棋盤');
    const triples=phase==='pick'?emptyPairs(board):[];
    board.forEach((value,i)=>{
      const cell=button(grid,'',()=>{
        if(pair.includes(i))pair=pair.filter(k=>k!==i);
        else if(triples.some(t=>[...pair,i].every(k=>t.includes(k))))pair.push(i);
        else pair=[i];
        paint();
      },'cell'+(pair.includes(i)?' selected':''));
      cell.setAttribute('aria-label',point(i)+(value?' '+(['','黑棋','白棋','中立棋'][value]):' 空格'));
      if(value)el(cell,'span','','stone '+(['','','ember','neutral'][value]));
      cell.disabled=phase!=='pick'||!!value||!triples.some(t=>t.includes(i));
    });
    const actions=el(panel,'div','','row actions');
    if(phase==='pick')button(actions,'確認提名',beginBids,'primary').disabled=pair.length!==3;
    if(phase==='pass')button(actions,'交畀'+duelNames[turn]+'出價',()=>{phase='bid';paint()},'primary');
    if(phase==='bid'){
      el(panel,'h3',duelNames[turn]+'暗中分配點數');
      const form=el(panel,'form');const fields=el(form,'div','','bid-grid');
      const inputs=pair.map(i=>{const label=el(fields,'label',point(i));const input=el(label,'input');input.type='number';input.inputMode='numeric';input.value=1;input.min=1;input.max=stock[turn];input.required=true;return input});
      const feedback=el(form,'p','','caption');const send=el(form,'button','鎖定出價','primary');send.type='submit';
      form.onsubmit=e=>{e.preventDefault();const bid=inputs.map(i=>i.valueAsNumber);
        if(bid.reduce((a,b)=>a+b,0)>stock[turn])feedback.textContent='三格出價總和超過你擁有嘅點數。';
        else lockBid(turn,bid);
      };
    }
    if(phase==='review')button(actions,'下一輪',next,'primary');
    if(phase==='done')button(actions,'再玩一局',()=>playLine(cpu),'primary');
    button(actions,'返回選擇',lineLobby);
  }
  paint();
}
const symbols={num:'',plus:'+',minus:'−',times:'×'};
function towerValue(stack){
 if(!stack.length||stack[0][0]!=='num')return null;
 let sum=0,term=stack[0][1];
 for(const [op,n] of stack.slice(1)){
  if(op==='num')return null;
  if(op==='times')term*=n;else{sum+=term;term=op==='minus'?-n:n}
 }
 return sum+term;
}
function moveTower(stacks,from,to,count,flip){
 if(count<1||count>stacks[from].length||from===to&&(!flip||count<2))return null;
 const next=stacks.map(s=>s.slice()),group=next[from].splice(0,count);
 if(flip)group.reverse();next[to].unshift(...group);return next;
}
function towerGoal(stacks,last){
 const existing=new Set(stacks.map(s=>s.length+':'+towerValue(s)));
 function candidate(s){
  const value=towerValue(s),key=s.length+':'+value;
  return s.length>=2&&value!==null&&value>0&&value<300&&!existing.has(key)&&key!==last?{value,height:s.length,key}:null;
 }
 for(let trial=0;trial<2000;trial++){
  let state=stacks;
  for(let j=0;j<8;j++){
   const from=shuffle([0,1,2,3]).find(i=>state[i].length),to=Math.floor(Math.random()*4);
   state=moveTower(state,from,to,1+Math.floor(Math.random()*state[from].length),Math.random()<.5)||state;
   for(const s of state){const goal=candidate(s);if(goal)return goal}
  }
 }
 // Any chosen pair can be exposed using the spare towers.
 const tiles=stacks.flat();for(const n of tiles.filter(t=>t[0]==='num'))for(const op of tiles){const goal=candidate([n,op]);if(goal)return goal}
 throw Error('未能產生下一題');
}
function towerLobby(){
 panel.replaceChildren();el(panel,'h2','三人同機搶答');
 button(panel,'開局',towerMatch,'primary');
}
function towerMatch(){
 let stacks=[[['num',2],['plus',3],['times',2]],[['num',3],['minus',2],['times',5]],[['num',5],['plus',7],['times',3]],[['num',7],['minus',3],['plus',5]]];
 let scores=[0,0,0],eligible=[0,1,2],tie=false,round=0,goal,lead,bids,moves,phase,msg,chosen=-1;
 const name=i=>'玩家 '+(i+1);
 function start(){round++;goal=towerGoal(stacks,goal?.key);lead=null;bids=new Set();moves=0;phase='bid';msg='';chosen=-1;paint()}
 function finish(ok){
  const pts=(lead.first?1:2)*(ok?1:-1);scores[lead.i]+=pts;msg=name(lead.i)+(ok?' 示範成功，':' 示範失敗，')+(pts>0?'+':'')+pts+' 分。';phase='result';
  if(Math.max(...eligible.map(i=>scores[i]))>=7){
   const low=Math.min(...eligible.map(i=>scores[i])),bottom=eligible.filter(i=>scores[i]===low);
   if(bottom.length<2){phase='end';msg+=' 包尾：'+name(bottom[0])}
   else{eligible=bottom;tie=true;msg+=' 包尾同分，進入加賽。'}
  }paint()
 }
 function paint(){

const wordIndex=new Map();
for(const [group,items] of Object.entries(vocabulary))for(const [word,labels] of Object.entries(items))wordIndex.set(word,{group,tags:new Set(labels.split(' '))});
const frequency=new Map();
for(const {tags} of wordIndex.values())for(const tag of tags)frequency.set(tag,(frequency.get(tag)||0)+1);

function similarity(guess,secret){
  if(guess===secret)return 100;
  const a=wordIndex.get(guess),b=wordIndex.get(secret);
  let common=0,union=0;
  for(const tag of new Set([...a.tags,...b.tags])){
    const weight=1+Math.log(wordIndex.size/frequency.get(tag));
    union+=weight;
    if(a.tags.has(tag)&&b.tags.has(tag))common+=weight;
  }
  const sameGroup=a.group===b.group;
  const ratio=common/union;
  return Math.min(96,Math.round((sameGroup?20:3)+(sameGroup?79:75)*ratio));
}

  status((diff?names[lead]+' 贏 1 分':'平手，雙方 0 分')+'　｜　'+names[a]+' '+score[a]+'：'+score[b]+' '+names[b]);log();
  if(history.length<7&&Math.abs(score[a]-score[b])<=7-history.length){button(panel,'下一回合 · '+names[lead]+' 先手',nextRound,'primary');return}
  if(score[a]===score[b]){el(panel,'p','全場平分，原班兩人重新配杯再賽。');button(panel,'重賽',begin,'primary');return}
  const winner=score[a]>score[b]?a:b;wins[winner]++;
  if(wins[winner]===2){el(panel,'h2',names[winner]+' 累積兩場勝利，晉級決賽！');button(panel,'再玩',gradLobby,'primary');return}
  el(panel,'p',names[winner]+' 贏出本場，下一場對 '+names[waiting]+'。');
  button(panel,'下一場',()=>{const loser=other(winner);a=winner;b=waiting;waiting=loser;begin()},'primary');
 }
 begin()
}

function finalGrid(size, label) {
 const grid=el(panel,'div','','final-grid');
 grid.style.setProperty('--size',size);grid.setAttribute('aria-label',label);
 return grid;
}
const chessCards=[
 ['直行一步',[[1,0],[0,1],[-1,0],[0,-1]]],
 ['斜行一步',[[1,1],[-1,1],[1,-1],[-1,-1]]],
 ['橫移兩格',[[2,0],[-2,0]]],
 ['向前跳躍',[[0,-2],[-1,-2],[1,-2]]],
 ['前斜後退',[[1,-1],[-1,-1],[0,1]]]
];
function cardJanggi(){
 let score=[0,0],starter=Math.random()<.5?0:1,turn,board,queues,plans,selected,setup;
 const names=['青方','赤方'];
 newRound();
 function newRound(){
  board=Array(25).fill('');
  for(const [i,p] of [[2,'1王'],[1,'1兵'],[3,'1兵'],[7,'1兵'],[22,'0王'],[21,'0兵'],[23,'0兵'],[17,'0兵']])board[i]=p;
  turn=starter;queues=[[],[]];plans=[[],[]];selected=-1;setup=0;plan(starter,true)
 }
 function pass(p,next){panel.replaceChildren();el(panel,'h2','請交機畀'+names[p]);button(panel,'準備好',next,'primary')}
 function plan(p,initial){
  plans[p]=[];
  pass(p,draw);
  function draw(){
   panel.replaceChildren();el(panel,'h2',names[p]+' · 編排移動牌');
   el(panel,'p','次序：'+plans[p].map(i=>chessCards[i][0]).join(' → '));
   for(const [i,[name]] of chessCards.entries())button(panel,name,()=>{plans[p].push(i);draw()}).disabled=plans[p].includes(i);
   button(panel,'重排',()=>{plans[p]=[];draw()});
   button(panel,'封存次序',()=>{
    queues[p]=plans[p].slice();
    if(initial&&setup++===0){plan(1-p,true);return}
    if(!initial)turn=1-p;
    play()
   },'primary').disabled=plans[p].length!==5;
  }
 }
 function targets(i){
  if(board[i][0]!==String(turn))return [];
  const x=i%5,y=Math.floor(i/5),sign=turn?-1:1;
  return chessCards[queues[turn][0]][1].map(([dx,dy])=>[x+dx*sign,y+dy*sign])
   .filter(([c,r])=>c>=0&&c<5&&r>=0&&r<5&&board[r*5+c][0]!==String(turn)).map(([c,r])=>r*5+c)
 }
 function advance(){
  queues[turn].shift();selected=-1;
  if(!queues[turn].length){plan(turn,false);return}
  turn=1-turn;play()
 }
 function play(){
  panel.replaceChildren();el(panel,'h2',names[turn]+' 行棋 · '+score.join(' 比 '));
  status(names.map((n,p)=>n+' 下張牌：'+chessCards[queues[p][0]][0]).join('　'));
  const legal=selected<0?[]:targets(selected),grid=finalGrid(5,'五乘五棋盤');
  board.forEach((p,i)=>{const node=button(grid,p.slice(1)||([2,22].includes(i)?'營':''),()=>{
   if(legal.includes(i)){
    const piece=board[selected],victim=board[i];board[i]=piece;board[selected]='';
    if(victim.endsWith('王')||piece.endsWith('王')&&i===(turn===0?2:22)){win();return}advance()
   }else{selected=i;play()}
  },(p?'side'+p[0]:'')+(legal.includes(i)?' legal':''));node.disabled=!legal.includes(i)&&!targets(i).length;node.setAttribute('aria-label','棋格 '+(i+1)+(p?' '+names[+p[0]]+p.slice(1):''))});
  if(!board.some((_,i)=>targets(i).length))button(panel,'無合法步 · 棄用呢張牌',advance,'primary')
 }
 function win(){
  const winner=turn;score[winner]++;
  panel.replaceChildren();el(panel,'h2',names[winner]+(score[winner]===2?' 贏出對局':' 贏出本局')+' · '+score.join(' 比 '));
  button(panel,score[winner]===2?'再玩':'下一局',()=>{if(score[winner]===2)cardJanggi();else{starter=1-starter;newRound()}},'primary')
 }
}
const linkPalette=['#ff847d','#83c8ff','#98e3ac','#ffe17b','#c69dff','#ffa9dc'];
function nearby(a,b){return Math.abs(a%8-b%8)+Math.abs(Math.floor(a/8)-Math.floor(b/8))===1}
function colorLink(){
 const size=8,names=['甲方','乙方'];
 let scores=[0,0],starter=Math.random()<.5?0:1,turn,board,placed,opening,color,phase,proof,drawColor,msg;
 start();
 function start(){
  turn=starter;board=Array(64).fill(-1);placed=[];opening=true;color=0;phase='place';proof=[];drawColor=0;msg='';render()
 }
 function endpoints(c){return board.flatMap((v,i)=>v===c?[i]:[])}
 function hasProof(){
  return proof.every((path,c)=>{const ends=endpoints(c);return !ends.length||path.length>=5&&ends.every(i=>i===path[0]||i===path.at(-1))})
 }
 function settle(p){
  scores[p]++;phase='end';msg=names[p]+' 贏出本局';render()
 }
 function confirm(){
  const allFull=board.filter(c=>c>=0).length===12;
  turn=1-turn;opening=false;placed=[];msg='';
  if(allFull){phase='proof';proof=linkPalette.map(()=>[]);msg='棋粒已落齊，請上一手玩家證明所有路線。'}
  render()
 }
 function render(){
  panel.replaceChildren();el(panel,'h2',scores.join(' 比 ')+' · '+(phase==='proof'?names[1-turn]+' 證明路線':phase==='place'?names[turn]+' 落子':'本局完結'));
  status(msg||(phase==='place'?'本手放 '+(opening?1:2)+' 粒，兩粒需用不同顏色。':'每條路線至少五格，橫直相連，路線不可交疊。'));
  if(phase==='end'){button(panel,scores.some(n=>n>=3)?'再玩':'下一局',()=>{if(scores.some(n=>n>=3))colorLink();else{starter=1-starter;start()}},'primary');return}
  const palette=el(panel,'div','','row actions');
  linkPalette.forEach((t,c)=>{const b=button(palette,String.fromCharCode(65+c),()=>{if(phase==='proof')drawColor=c;else color=c;render()});b.style.color=t;b.setAttribute('aria-pressed',String(c===(phase==='proof'?drawColor:color)));if(phase==='proof')b.disabled=!endpoints(c).length});
  const grid=finalGrid(size,'顏色連線棋盤');
  board.forEach((v,i)=>{
   const route=phase==='proof'?proof.findIndex(p=>p.includes(i)):-1;
   const b=button(grid,v>=0?String.fromCharCode(65+v):route>=0?'•':'',()=>{
    if(phase==='place'){
     if(v>=0){const j=placed.indexOf(i);if(j>=0){placed.splice(j,1);board[i]=-1;render()}return}
     if(placed.length===(opening?1:2)||endpoints(color).length===2||placed.some(j=>board[j]===color))return;
     board[i]=color;placed.push(i);
    }else{
     const path=proof[drawColor];
     if(path.at(-1)===i){path.pop();render();return}
     if(route>=0||v>=0&&v!==drawColor||!path.length&&v!==drawColor||path.length&&!nearby(path.at(-1),i))return;
     if(path.length>1&&board[path.at(-1)]===drawColor)return;
     path.push(i)
    }
    render()
   });
   if(v>=0||route>=0){b.style.color=linkPalette[Math.max(v,route)];b.classList.add('legal')}
   b.setAttribute('aria-label','第 '+(i+1)+' 格'+(v>=0?' '+String.fromCharCode(65+v):''));
  });
  if(phase==='place'){
   button(panel,'確認落子',confirm,'primary').disabled=placed.length!==(opening?1:2)&&!(placed.length===1&&board.filter(v=>v>=0).length===12);
   if(!opening)button(panel,'質疑無法連線',()=>{phase='proof';proof=linkPalette.map(()=>[]);drawColor=board.find(v=>v>=0);msg='請上一手玩家逐色畫線，未配對嘅棋可用路線末端補上。';render()}).disabled=!!placed.length;
  }else{
   button(panel,'清除所選路線',()=>{proof[drawColor]=[];render()});
   button(panel,'提交證明',()=>{if(hasProof())settle(1-turn)},'primary').disabled=!hasProof();
   button(panel,'放棄證明',()=>settle(turn))
  }
 }
}
function eqFeedback(guess,secret){
 const marks=Array(guess.length).fill(0),stock=new Map();
 for(let i=0;i<secret.length;i++){if(guess[i]===secret[i])marks[i]=2;else stock.set(secret[i],(stock.get(secret[i])||0)+1)}
 for(let i=0;i<guess.length;i++)if(!marks[i]&&stock.get(guess[i])){marks[i]=1;stock.set(guess[i],stock.get(guess[i])-1)}
 return marks
}
function eqValid(formula){
 if(!/^[0-9+*/^=\-]{9}$/.test(formula))return false;
 const sides=formula.split('=');if(sides.length!==2)return false;
 function value(side){
  if(!/^(0|[1-9]\d*)([+*/^\-](0|[1-9]\d*))*$/.test(side))return NaN;
  const tokens=side.match(/\d+|[^\d]/g);
  for(const ops of [['^'],['*','/'],['+','-']]){
   let i=1;
   while(i<tokens.length){
    const op=tokens[i];
    if(!ops.includes(op)){i+=2;continue}
    if(op==='^'&&tokens[i+2]==='^'){i+=2;continue}
    const a=Number(tokens[i-1]),b=Number(tokens[i+1]);
    const n=op==='^'?a**b:op==='*'?a*b:op==='/'?a/b:op==='+'?a+b:a-b;
    tokens.splice(i-1,3,n);i=Math.max(1,i-2);
   }
  }
  return Number(tokens[0])
 }
 const [a,b]=sides.map(value);
 return Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)<=1e-10
}
function equationLights(){
 let secrets=[],guesses=[],records=[[],[]],round=1,p=0;
 const names=['甲方','乙方'];
 handover();
 function handover(){
  panel.replaceChildren();el(panel,'h2','請交機畀'+names[p]);button(panel,'準備好',input,'primary')
 }
 function show(parent,entry){
  const row=el(parent,'div','','equation-row');
  [...entry.text].forEach((c,i)=>{const tile=el(row,'span',c,'eq-'+entry.marks[i]);tile.setAttribute('aria-label',c+' '+['紅','黃','綠'][entry.marks[i]])})
 }
 function input(){
  const setup=secrets.length<2;
  panel.replaceChildren();el(panel,'h2',names[p]+' · '+(setup?'設定秘密算式':'第 '+round+' 輪猜算式'));
  if(!setup)records[p].forEach(entry=>show(panel,entry));
  const form=el(panel,'form'),field=el(form,'input');field.maxLength=9;field.autocomplete='off';field.spellcheck=false;field.setAttribute('aria-label','九格算式');field.placeholder=setup?'例 12+3=30/2':'輸入 9 個字元';
  const keys=el(form,'div','','row actions');
  for(const c of '0123456789+-*/^=')button(keys,c,()=>{if(field.value.length<9)field.value+=c});
  button(keys,'刪除',()=>{field.value=field.value.slice(0,-1)});
  const feedback=el(form,'p','','status'),submit=el(form,'button','鎖定','primary');submit.type='submit';
  form.onsubmit=e=>{
   e.preventDefault();const text=field.value.trim().replaceAll('×','*').replaceAll('÷','/');
   if(setup?!eqValid(text):!/^[0-9+*/^=\-]{9}$/.test(text)){feedback.textContent=setup?'請輸入有效等式，剛好 9 格。':'請填滿 9 格，只用數字同指定符號。';return}
   if(setup)secrets.push(text);else guesses.push(text);
   if(!setup&&p===1){reveal();return}
   p=1-p;handover()
  }
 }
 function reveal(){
  panel.replaceChildren();el(panel,'h2','第 '+round+' 輪 · 同步揭曉');
  const hits=guesses.map((text,i)=>{const marks=eqFeedback(text,secrets[1-i]);const entry={text,marks};records[i].push(entry);el(panel,'p',names[i]);show(panel,entry);return marks.filter(n=>n===2).length});
  if(hits.includes(9)||round===8){
   const totals=hits.includes(9)?hits:records.map(r=>Math.max(...r.map(e=>e.marks.filter(n=>n===2).length)));
   status(totals[0]===totals[1]?'平手，重新出題。':names[totals[0]>totals[1]?0:1]+' 勝出！');
   el(panel,'p','秘密算式：'+secrets.join(' ／ '));button(panel,'再玩',equationLights,'primary');return
  }
  button(panel,'下一輪',()=>{round++;guesses=[];p=0;handover()},'primary')
 }
}
