<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>策略挑戰</title>
<style>
:root{color-scheme:dark;--ink:#f5ebda;--muted:#c0b5aa;--gold:#e9bf7e;--panel:#201b23;--stroke:#584838;--jade:#72dbbd;--rose:#ffa799}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 85% 0%,#3b282c,transparent 52%),#151318;color:var(--ink);font:16px/1.5 "PingFang HK","Noto Sans CJK TC",system-ui,sans-serif}
main{max-width:810px;margin:auto;padding:20px 14px 50px}
a{color:var(--gold)} h1,h2,h3,p{margin:0} h1{font-size:clamp(29px,6vw,47px);letter-spacing:.05em;margin:14px 0 6px}
nav,.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
nav{margin:16px 0} button,select,input{font:inherit}
button,select,input{border:1px solid #80705c;border-radius:7px;background:#302934;color:var(--ink);min-height:44px;padding:8px 12px}
button{cursor:pointer} button:hover:not(:disabled){border-color:var(--gold)} button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
button:disabled{opacity:.5;cursor:default} .primary,[aria-pressed=true]{background:#594228;border-color:#cb9b61}
.panel{background:var(--panel);border:1px solid var(--stroke);border-radius:14px;padding:clamp(12px,3vw,24px)}
.sub,.caption,small{color:var(--muted)} .caption{font-size:14px} .stats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.stats span,.tag{display:inline-block;border-radius:6px;background:#302733;padding:4px 9px;border:1px solid var(--stroke)}
.status{min-height:24px;margin:10px 0;color:var(--gold)} .actions{margin-top:14px}
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:min(100%,430px);margin:12px auto;border:1px solid #9d7553;background:#4e352d;padding:4px;border-radius:8px}
.cell{display:grid;place-items:center;padding:0;width:100%;min-height:0;aspect-ratio:1;background:#d0a976;box-shadow:inset 0 0 0 1px #f4d3a1;border:0;border-radius:3px;color:#311f19}
.cell:disabled{opacity:1} .cell.selected{background:#f4d59d;outline:3px solid #47311f;outline-offset:-4px}
.stone{display:block;width:69%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 1px 0 #fff7,0 2px 3px #291913aa;background:radial-gradient(circle at 33% 22%,#d6fff2,#427b70 55%,#1f4d45)}
.stone.ember{background:radial-gradient(circle at 33% 22%,#ffd8c1,#ba503a 55%,#711e13)} .stone.neutral{background:radial-gradient(circle at 33% 22%,#eee0cd,#737078 55%,#403641)}
.bid-grid,.towers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}
.bid-grid label{display:grid;gap:4px} input[type=number]{width:100%;min-width:0} .tower{min-width:0;min-height:225px;display:flex;flex-direction:column;justify-content:end;gap:5px;padding:6px;background:#201a22}
.tile{display:block;color:#251910;background:linear-gradient(160deg,#f2d29f,#b48559);border:1px solid #ecc89a;border-radius:5px;padding:3px;text-align:center;font-weight:750}
.tile.minus{background:linear-gradient(160deg,#fac0b0,#be7662)} .tile.times{background:linear-gradient(160deg,#ace5d4,#66a393)}
.goal{color:var(--jade)} .history{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.history li{display:grid;grid-template-columns:minmax(65px,1fr) 3fr 54px;align-items:center;gap:8px;padding:7px;border-bottom:1px solid var(--stroke)} meter{width:100%;height:16px;accent-color:var(--jade)}
.guess input{flex:1;min-width:120px} .guess{margin-top:10px} details{margin:14px 0}
summary{cursor:pointer} .wordlist{margin:8px 0;max-height:150px;overflow:auto;line-height:1.8}
.board{grid-template-columns:repeat(15,minmax(0,1fr));gap:0;padding:8px;background:#cba36f}.cell{box-shadow:none;border-radius:0;background:linear-gradient(90deg,transparent 48%,#785a36 48% 52%,transparent 52%),linear-gradient(transparent 48%,#785a36 48% 52%,transparent 52%)}.stone{width:85%;background:radial-gradient(at 35% 25%,#62616b,#0c0b0c 70%)}.stone.ember{background:radial-gradient(at 35% 25%,white,#ded5ca 68%,#a99b91)}.tile.num{background:#c3a7eb}.hero{float:right;width:clamp(75px,21vw,148px);height:108px;object-fit:cover;border-radius:8px;margin:0 0 8px 12px}.panel{clear:both}</style>
</head>
<body><main>
<a href="./">‹ 所有遊戲</a>
<nav aria-label="挑戰選擇" id="tabs"></nav>
<img id="hero" class="hero" alt=""><h1 id="title"></h1>
<p id="episode" class="caption"></p>
<p id="intro" class="sub"></p>
<details><summary>遊戲玩法</summary><p id="rules"></p></details>
<section id="game" class="panel"></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const panel=$('game');
const sections={
  line:['點數五子棋','輪流揀三點，秘密競投棋位。','黑棋先選。每輪揀橫、直或斜線上連續三個空位。每人收 10 點，每格暗投至少 1 整點，高價落子，同價歸非選位方。餘點減半向下取整後帶入下輪。同步落完三子先判定，恰好五連先計，六連以上無效。同輪比較五連條數。'],
  tower:['算式之塔','鬥少步報價，再親手砌出目標算式。','三人搶報步數，每人只可報一次。其餘人可報更少步，最低者獨自示範。每步可搬頂部一組積木，可反轉整組，亦可原地翻轉。指定高度、指定結果、所報步數要全部吻合。由頂向下讀，頂層必須係無符號數字，先乘後加減。首報成功加 1、失敗扣 1；後報加扣 2。塔形帶入下一題。先到 7 分完場，包尾同分加賽。'],
  words:['隱藏詞語','保護自己嘅秘密詞，同時估中對手嘅詞。','抽籤定次序，每人獲五個普通名詞。第一輪五揀一，第二輪從餘下四個再揀。每階段出題人最多提供十個名詞線索，公開相似度，達 95% 即停，否則系統補最高相似度提示。其他人暗中作答，齊人先揭曉。每個秘密詞可花一枚 Piece 加答一次。估中者各得 1 分並結束該題。全員估錯，出題人按階段得 1、2、3 分。每題最多三階段，第二輪全部分數加倍。繁中版用本地詞庫評分。']
};
const order={words:[49,11],tower:[50,12],line:[51,13]};
let active='words';
function el(parent,tag,text='',className=''){
  const node=document.createElement(tag);
  node.className=className;node.textContent=text;parent.append(node);return node;
}
function button(parent,label,click,className=''){
  const node=el(parent,'button',label,className);node.type='button';node.onclick=click;return node;
}
function status(text=''){const node=el(panel,'p',text,'status');node.setAttribute('role','status');return node}
function tabs(){ $('tabs').replaceChildren();for(const [key,[id]] of Object.entries(order)){
  const node=button($('tabs'),id+' '+sections[key][0],()=>selectGame(key));
  node.setAttribute('aria-pressed',String(key===active));
}}
function selectGame(key){
  active=Object.hasOwn(sections,key)?key:'words';
  const [title,intro,rules]=sections[active];
  const [id,episode]=order[active];
  $('title').textContent=id+' '+title;$('episode').textContent='第 3 季・第 '+episode+' 集';$('intro').textContent=intro;$('rules').textContent=rules;
  $('hero').src=(typeof coverData==='undefined'?'./art/game-'+id+'.webp':coverData[id]);
  document.title=title+'｜策略挑戰';tabs();
  ({line:lineLobby,tower:towerLobby,words:wordLobby})[active]();
}
function choice(parent,label,entries){
  const wrap=el(parent,'label',label+' ');
  const select=el(wrap,'select');
  for(const [id,text] of entries){const option=el(select,'option',text);option.value=id}
  return select;
}
function shuffle(data){const copy=data.slice();for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
const N=15, directions=[[1,0],[0,1],[1,1],[-1,1]];
const point=i=>String.fromCharCode(65+i%N)+(Math.floor(i/N)+1);
function ray(i,dx,dy,k){
 const x=i%N+dx*k,y=Math.floor(i/N)+dy*k;
 return x<0||x>=N||y<0||y>=N?-1:y*N+x;
}
function lineWins(board,team){
 let count=0;
 board.forEach((v,i)=>{if(v===team)for(const [x,y] of directions){
 if(board[ray(i,x,y,-1)]===team)continue;
 let n=1;while(board[ray(i,x,y,n)]===team)n++;if(n===5)count++;
 }});return count;
}
function emptyPairs(board){
 const out=[];
 board.forEach((v,i)=>{if(!v)for(const [x,y] of directions){
 const cells=[i,ray(i,x,y,1),ray(i,x,y,2)];if(cells.every(k=>board[k]===0))out.push(cells);
 }});return out;
}
const duelNames=['黑棋','白棋'];
function lineLobby(){
  panel.replaceChildren();el(panel,'h2','選擇對手');
  const actions=el(panel,'div','','row actions');
  button(actions,'對電腦',()=>playLine(true),'primary');
  button(actions,'同機雙人',()=>playLine(false));
}
function playLine(cpu){
  const board=Array(N*N).fill(0),stock=[10,10];
  let round=1,owner=0,pair=[],offers=[],phase='pick',turn=0,note='',result='';
  function botPair(){
    const pairs=shuffle(emptyPairs(board));
    return pairs.find(cells=>cells.some(i=>threat(i,2)))||pairs.find(cells=>cells.some(i=>threat(i,1)))||pairs[0];
  }
  function threat(i,team){const next=board.slice();next[i]=team;return lineWins(next,team)}
  function beginBids(){
    turn=owner;offers=[];phase='bid';
    if(cpu&&turn===1)lockBid(1,botBid());
    else paint();
  }
  function botBid(){
    const priority=pair.map(i=>Number(threat(i,2))*2+Number(threat(i,1)));
    const bid=[1,1,1], limit=stock[1]-Math.floor(Math.random()*3);
    const best=priority.indexOf(Math.max(...priority));
    for(let n=3;n<limit;n++)bid[priority[best]&&Math.random()<0.7?best:Math.floor(Math.random()*3)]++;
    return bid;
  }
  function lockBid(team,bid){
    if(phase!=='bid'||team!==turn||bid.some(n=>!Number.isInteger(n)||n<1)||bid.reduce((a,b)=>a+b,0)>stock[team])return;
    offers[team]=bid;
    if(offers[0]&&offers[1]){
      pair.forEach((cell,i)=>{board[cell]=offers[0][i]===offers[1][i]?2-owner:offers[0][i]>offers[1][i]?1:2});
      for(let i=0;i<2;i++)stock[i]=Math.floor((stock[i]-offers[i].reduce((a,b)=>a+b,0))/2);
      note=pair.map((cell,i)=>point(cell)+'（'+(duelNames[board[cell]-1]||'中立')+'）').join('　');
      const wins=[lineWins(board,1),lineWins(board,2)];
      if(wins[0]||wins[1])result=wins[0]===wins[1]?'雙方五連條數相同，和局。':duelNames[wins[0]>wins[1]?0:1]+'勝出！';
      else if(!emptyPairs(board).length)result='無相連空格，和局。';
      phase=result?'done':'review';paint();return;
    }
    turn=1-team;
    if(cpu&&turn===1){lockBid(1,botBid());return}
    phase=cpu?'bid':'pass';paint();
  }
  function next(){
    round++;owner=1-owner;pair=[];offers=[];note='';
    for(let i=0;i<2;i++)stock[i]=stock[i]+10;
    phase='pick';
    if(cpu&&owner===1){pair=botPair();beginBids();return}
    paint();
  }
  function paint(){
    panel.replaceChildren();const info=el(panel,'div','','stats');
    for(const label of ['第 '+round+' 輪',phase==='bid'?duelNames[turn]+' 可用 '+stock[turn]+' 點':'選位方：'+duelNames[owner]])el(info,'span',label);
    status(result||note||(phase==='pick'?duelNames[owner]+'揀同一直線上連續三個空位。':'本輪提名 '+pair.map(point).join('、')));
    const grid=el(panel,'div','','board');grid.setAttribute('aria-label','十五路棋盤');
    const triples=phase==='pick'?emptyPairs(board):[];
    board.forEach((value,i)=>{
      const cell=button(grid,'',()=>{
        if(pair.includes(i))pair=pair.filter(k=>k!==i);
        else if(triples.some(t=>[...pair,i].every(k=>t.includes(k))))pair.push(i);
        else pair=[i];
        paint();
      },'cell'+(pair.includes(i)?' selected':''));
      cell.setAttribute('aria-label',point(i)+(value?' '+(['','黑棋','白棋','中立棋'][value]):' 空格'));
      if(value)el(cell,'span','','stone '+(['','','ember','neutral'][value]));
      cell.disabled=phase!=='pick'||!!value||!triples.some(t=>t.includes(i));
    });
    const actions=el(panel,'div','','row actions');
    if(phase==='pick')button(actions,'確認提名',beginBids,'primary').disabled=pair.length!==3;
    if(phase==='pass')button(actions,'交畀'+duelNames[turn]+'出價',()=>{phase='bid';paint()},'primary');
    if(phase==='bid'){
      el(panel,'h3',duelNames[turn]+'暗中分配點數');
      const form=el(panel,'form');const fields=el(form,'div','','bid-grid');
      const inputs=pair.map(i=>{const label=el(fields,'label',point(i));const input=el(label,'input');input.type='number';input.inputMode='numeric';input.value=1;input.min=1;input.max=stock[turn];input.required=true;return input});
      const feedback=el(form,'p','','caption');const send=el(form,'button','鎖定出價','primary');send.type='submit';
      form.onsubmit=e=>{e.preventDefault();const bid=inputs.map(i=>i.valueAsNumber);
        if(bid.reduce((a,b)=>a+b,0)>stock[turn])feedback.textContent='三格出價總和超過你擁有嘅點數。';
        else lockBid(turn,bid);
      };
    }
    if(phase==='review')button(actions,'下一輪',next,'primary');
    if(phase==='done')button(actions,'再玩一局',()=>playLine(cpu),'primary');
    button(actions,'返回選擇',lineLobby);
  }
  paint();
}
const symbols={num:'',plus:'+',minus:'−',times:'×'};
function towerValue(stack){
 if(!stack.length||stack[0][0]!=='num')return null;
 let sum=0,term=stack[0][1];
 for(const [op,n] of stack.slice(1)){
  if(op==='num')return null;
  if(op==='times')term*=n;else{sum+=term;term=op==='minus'?-n:n}
 }
 return sum+term;
}
function moveTower(stacks,from,to,count,flip){
 if(count<1||count>stacks[from].length||from===to&&(!flip||count<2))return null;
 const next=stacks.map(s=>s.slice()),group=next[from].splice(0,count);
 if(flip)group.reverse();next[to].unshift(...group);return next;
}
function towerGoal(stacks,last){
 const existing=new Set(stacks.map(s=>s.length+':'+towerValue(s)));
 function candidate(s){
  const value=towerValue(s),key=s.length+':'+value;
  return s.length>=2&&value!==null&&value>0&&value<300&&!existing.has(key)&&key!==last?{value,height:s.length,key}:null;
 }
 for(let trial=0;trial<2000;trial++){
  let state=stacks;
  for(let j=0;j<8;j++){
   const from=shuffle([0,1,2,3]).find(i=>state[i].length),to=Math.floor(Math.random()*4);
   state=moveTower(state,from,to,1+Math.floor(Math.random()*state[from].length),Math.random()<.5)||state;
   for(const s of state){const goal=candidate(s);if(goal)return goal}
  }
 }
 // Any chosen pair can be exposed using the spare towers.
 const tiles=stacks.flat();for(const n of tiles.filter(t=>t[0]==='num'))for(const op of tiles){const goal=candidate([n,op]);if(goal)return goal}
 throw Error('未能產生下一題');
}
function towerLobby(){
 panel.replaceChildren();el(panel,'h2','三人同機搶答');
 button(panel,'開局',towerMatch,'primary');
}
function towerMatch(){
 let stacks=[[['num',2],['plus',3],['times',2]],[['num',3],['minus',2],['times',5]],[['num',5],['plus',7],['times',3]],[['num',7],['minus',3],['plus',5]]];
 let scores=[0,0,0],eligible=[0,1,2],tie=false,round=0,goal,lead,bids,moves,phase,msg,chosen=-1;
 const name=i=>'玩家 '+(i+1);
 function start(){round++;goal=towerGoal(stacks,goal?.key);lead=null;bids=new Set();moves=0;phase='bid';msg='';chosen=-1;paint()}
 function finish(ok){
  const pts=(lead.first?1:2)*(ok?1:-1);scores[lead.i]+=pts;msg=name(lead.i)+(ok?' 示範成功，':' 示範失敗，')+(pts>0?'+':'')+pts+' 分。';phase='result';
  if(Math.max(...eligible.map(i=>scores[i]))>=7){
   const low=Math.min(...eligible.map(i=>scores[i])),bottom=eligible.filter(i=>scores[i]===low);
   if(bottom.length<2){phase='end';msg+=' 包尾：'+name(bottom[0])}
   else{eligible=bottom;tie=true;msg+=' 包尾同分，進入加賽。'}
  }paint()
 }
 function paint(){
  panel.replaceChildren();el(panel,'h2',(tie?'加賽':'第 '+round+' 題')+' · 目標 '+goal.value+' ／ '+goal.height+' 層');
  el(panel,'p',scores.map((s,i)=>name(i)+' '+s+' 分').join('　'));
  const towers=el(panel,'div','','towers');towers.style.gridTemplateColumns='repeat(4,minmax(0,1fr))';
  stacks.forEach((s,i)=>{const col=el(towers,'div','','tower');el(col,'small','ABCD'[i]+' 塔');for(const [op,n] of s)el(col,'span',symbols[op]+n,'tile '+op)});
  status(msg);
  if(phase==='bid'){
   if(lead)el(panel,'p',name(lead.i)+' 報 '+lead.n+' 步，其餘玩家可搶報更少步。');
   const bidders=eligible.filter(i=>!bids.has(i));
   if(bidders.length&&(!lead||lead.n>1)){
    const who=choice(panel,'搶答者',bidders.map(i=>[i,name(i)]));
    const field=el(panel,'input');field.type='number';field.min=1;field.placeholder='報幾多步';field.setAttribute('aria-label','步數');
    button(panel,'鎖定步數',()=>{const n=field.valueAsNumber;if(!Number.isInteger(n)||n<1||lead&&n>=lead.n){field.setCustomValidity('請報有效而更少嘅正整數');field.reportValidity();field.setCustomValidity('');return}
     lead={i:+who.value,n,first:!lead};bids.add(lead.i);paint()});
   }
   if(lead)button(panel,'結束搶答，開始示範',()=>{phase='move';paint()},'primary');else button(panel,'無人搶答，跳題',start);
  }else if(phase==='move'){
   el(panel,'p',name(lead.i)+' 示範 · '+moves+' / '+lead.n+' 步');
   const ids=[0,1,2,3],from=choice(panel,'由',ids.filter(i=>stacks[i].length).map(i=>[i,'ABCD'[i]]));
   if(chosen>=0&&stacks[chosen].length)from.value=chosen;
   from.onchange=()=>{chosen=+from.value;paint()};
   const count=choice(panel,'頂部層數',stacks[+from.value].map((_,i)=>[i+1,i+1]));
   const to=choice(panel,'移到',ids.map(i=>[i,'ABCD'[i]]));to.value=(+from.value+1)%4;
   const flip=choice(panel,'方向',[[0,'保持'],[1,'上下反轉']]);
   button(panel,'確認一步',()=>{const next=moveTower(stacks,+from.value,+to.value,+count.value,+flip.value);if(!next){msg='原地要翻轉至少兩層。';paint();return}
    stacks=next;moves++;chosen=-1;msg='';if(moves===lead.n)finish(stacks.some(s=>s.length===goal.height&&towerValue(s)===goal.value));else paint()},'primary');
   button(panel,'放棄示範',()=>finish(false));
  }else button(panel,phase==='end'?'重新開局':'下一題',phase==='end'?towerMatch:start,'primary');
 }
 start()
}
const vocabulary={
  '飲食':{
    '奶茶':'飲品 茶 奶 香港 茶餐廳', '咖啡':'飲品 咖啡因 茶餐廳 早餐', '檸檬茶':'飲品 茶 水果 酸 茶餐廳', '豆漿':'飲品 豆 早餐 奶狀',
    '菠蘿包':'麵包 烘焙 香港 茶餐廳 早餐', '蛋撻':'甜品 烘焙 蛋 香港 茶餐廳', '雞蛋仔':'甜品 小食 蛋 香港 街頭', '燒賣':'點心 小食 蒸 香港 街頭',

const aliasData={'咖啡':'咖啡','冰淇淋':'雪糕','巴士':'巴士','公車':'巴士','出租車':'的士','計程車':'的士','自行車':'單車','腳踏車':'單車','摩托車':'電單車','地下鐵':'地鐵','雨衣':'雨褸','空調':'冷氣','冰箱':'雪櫃','游泳':'游水','兔子':'兔仔','小貓':'貓','小狗':'狗','鳳梨包':'菠蘿包','橘子':'橙','氣霧':'霧'};
const wordIndex=new Map();
for(const [group,items] of Object.entries(vocabulary))for(const [word,labels] of Object.entries(items))wordIndex.set(word,{group,tags:new Set(labels.split(' '))});
const frequency=new Map();
for(const {tags} of wordIndex.values())for(const tag of tags)frequency.set(tag,(frequency.get(tag)||0)+1);
const normalize=input=>{const word=input.normalize('NFKC').trim();return Object.hasOwn(aliasData,word)?aliasData[word]:word};
function similarity(guess,secret){
  if(guess===secret)return 100;
  const a=wordIndex.get(guess),b=wordIndex.get(secret);
  let common=0,union=0;
  for(const tag of new Set([...a.tags,...b.tags])){
    const weight=1+Math.log(wordIndex.size/frequency.get(tag));
    union+=weight;
    if(a.tags.has(tag)&&b.tags.has(tag))common+=weight;
  }
  const sameGroup=a.group===b.group;
  const ratio=common/union;
  return Math.min(96,Math.round((sameGroup?20:3)+(sameGroup?79:75)*ratio));
}
function wordLobby(){
 panel.replaceChildren();el(panel,'h2','同機傳機玩');
 const count=choice(panel,'玩家人數',[2,3,4,5,6].map(n=>[n,n+' 人']));
 el(panel,'p','每人輸入自己開局持有嘅 Piece 數，提交後交機。','caption');
 button(panel,'抽籤開局',()=>wordMatch(+count.value),'primary')
}
function wordMatch(count){
 const pool=shuffle([...wordIndex.keys()]),players=shuffle(Array.from({length:count},(_,i)=>({name:'玩家 '+(i+1),hand:pool.splice(0,5),score:0,pieces:0})));
 let round=1,setterIndex=0,stage=1,clues=[],attempt=0,answers=[],spent=new Set(),selected=0;
 const setter=()=>players[setterIndex];
 function clear(title){panel.replaceChildren();el(panel,'h2',title)}
 function pass(player,action){
  clear('請交機畀'+player.name);button(panel,'我係'+player.name+'，繼續',action,'primary');
 }
 function chooseSecret(){
  const p=players[selected];pass(p,()=>{clear(p.name+' · 第 '+round+' 輪揀秘密詞');
   const select=choice(panel,'信封',p.hand.map(w=>[w,w]));
   let pieces;if(round===1){pieces=el(panel,'input');pieces.type='number';pieces.min=0;pieces.value=0;pieces.setAttribute('aria-label','持有 Piece 數');el(panel,'small','開局持有 Piece 數')}
   button(panel,'封存秘密詞',()=>{if(pieces){if(!Number.isSafeInteger(pieces.valueAsNumber)||pieces.valueAsNumber<0)return; p.pieces=pieces.valueAsNumber}
    p.secret=select.value;p.hand=p.hand.filter(w=>w!==p.secret);if(++selected<count)chooseSecret();else beginWord()},'primary');
  })
 }
 function beginWord(){stage=1;clues=[];spent=new Set();beginStage()}
 function beginStage(){attempt=0;answers=[];pass(setter(),clueForm)}
 function history(){for(const c of clues)el(panel,'p','第 '+c.stage+' 階段 · '+c.word+'　'+c.score+'%'+(c.auto?'（自動線索）':''))}
 function clueForm(){
  const p=setter();clear(p.name+' 出線索 · 第 '+stage+' 階段');el(panel,'p','你嘅秘密詞：'+p.secret);history();
  const remaining=[...wordIndex.keys()].filter(w=>w!==p.secret&&!clues.some(c=>c.word===w));
  const pick=choice(panel,'第 '+(attempt+1)+' 個線索',remaining.sort((a,b)=>a.localeCompare(b,'zh-HK')).map(w=>[w,w]));
  button(panel,'公開線索',()=>{const word=pick.value,score=similarity(word,p.secret);clues.push({word,score,stage});attempt++;
   if(score<95&&attempt===10){
    const best=remaining.filter(w=>w!==word).sort((a,b)=>similarity(b,p.secret)-similarity(a,p.secret))[0];
    if(best)clues.push({word:best,score:similarity(best,p.secret),stage,auto:true});
   }
   clear('公開線索');history();
   if(score>=95||attempt===10)button(panel,'開始秘密作答',()=>ask(0),'primary');
   else button(panel,'下一個線索',()=>pass(p,clueForm),'primary')
  },'primary');
 }
 function ask(i){
  if(i===count){reveal();return}if(i===setterIndex){ask(i+1);return}
  const p=players[i];pass(p,()=>{clear(p.name+' 秘密作答');history();
   const a=el(panel,'input');a.placeholder='你估嘅名詞';let b;
   if(p.pieces>0&&!spent.has(i)){b=el(panel,'input');b.placeholder='加答（花 1 Piece，可留空）'}
   button(panel,'鎖定答案',()=>{const word=normalize(a.value);if(!word)return;
    const extra=b&&normalize(b.value);if(extra&&extra!==word){spent.add(i);p.pieces--}
    answers.push({i,words:extra&&extra!==word?[word,extra]:[word]});ask(i+1)},'primary')
  })
 }
 function reveal(){
  const p=setter(),correct=answers.filter(a=>a.words.includes(p.secret)),ended=correct.length>0||stage===3;
  clear('同步揭曉');for(const a of answers)el(panel,'p',players[a.i].name+'：'+a.words.join('、'));
  if(correct.length){for(const a of correct)players[a.i].score+=round;status(correct.map(a=>players[a.i].name).join('、')+' 猜中，各得 '+round+' 分。')}
  else{p.score+=round*stage;status('無人估中，'+p.name+' 得 '+round*stage+' 分。')}
  if(ended)el(panel,'h3','秘密詞：'+p.secret);
  button(panel,ended?'繼續':'下一階段',()=>{if(!ended){stage++;beginStage();return}
   if(++setterIndex<count){beginWord();return}
   if(round===1){round=2;players.splice(0,players.length,...shuffle(players));selected=0;setterIndex=0;chooseSecret();return}
   clear('最終排名');players.slice().sort((a,b)=>b.score-a.score).forEach(p=>el(panel,'p',p.name+'　'+p.score+' 分'));button(panel,'再開一局',wordLobby)
  },'primary')
 }
 chooseSecret()
}
